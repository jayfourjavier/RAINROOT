<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='980' viewBox='0 0 1500 980' font-family='Arial, Helvetica, sans-serif'>
<rect width='1500' height='980' fill='#ffffff'/>
<text x='30' y='36' font-size='24' font-weight='bold' fill='#111'>Control Logic Flowchart</text>

<defs>
  <marker id='arrow' markerWidth='10' markerHeight='7' refX='9' refY='3.5' orient='auto'>
    <polygon points='0 0, 10 3.5, 0 7' fill='#444'/>
  </marker>
</defs>

<ellipse cx='120' cy='96' rx='70' ry='30' fill='#e8f5e9' stroke='#2e7d32' stroke-width='2'/>
<text x='120' y='102' text-anchor='middle' font-size='14' fill='#111'>Start</text>

<rect x='240' y='66' width='250' height='60' rx='8' fill='#f5f5f5' stroke='#444' stroke-width='2'/>
<text x='365' y='92' text-anchor='middle' font-size='13' fill='#111'>Initialize pins and set</text>
<text x='365' y='110' text-anchor='middle' font-size='13' fill='#111'>moisture threshold</text>

<rect x='540' y='66' width='230' height='60' rx='8' fill='#f5f5f5' stroke='#444' stroke-width='2'/>
<text x='655' y='102' text-anchor='middle' font-size='13' fill='#111'>Set plant index i = 1</text>

<rect x='820' y='66' width='280' height='60' rx='8' fill='#fff3e0' stroke='#ef6c00' stroke-width='2'/>
<text x='960' y='92' text-anchor='middle' font-size='13' fill='#111'>Read soil moisture sensor i</text>
<text x='960' y='110' text-anchor='middle' font-size='13' fill='#111'>on A0-A3</text>

<polygon points='960,170 1080,230 960,290 840,230' fill='#e3f2fd' stroke='#1565c0' stroke-width='2'/>
<text x='960' y='224' text-anchor='middle' font-size='13' fill='#111'>Soil moisture</text>
<text x='960' y='242' text-anchor='middle' font-size='13' fill='#111'>below threshold?</text>

<rect x='1140' y='204' width='250' height='52' rx='8' fill='#f5f5f5' stroke='#444' stroke-width='2'/>
<text x='1265' y='236' text-anchor='middle' font-size='13' fill='#111'>Turn ON relay i to start pump i</text>

<rect x='1140' y='294' width='250' height='52' rx='8' fill='#f5f5f5' stroke='#444' stroke-width='2'/>
<text x='1265' y='326' text-anchor='middle' font-size='13' fill='#111'>Wait watering duration</text>

<rect x='1140' y='384' width='250' height='52' rx='8' fill='#f5f5f5' stroke='#444' stroke-width='2'/>
<text x='1265' y='416' text-anchor='middle' font-size='13' fill='#111'>Turn OFF relay i</text>

<polygon points='960,470 1080,530 960,590 840,530' fill='#e3f2fd' stroke='#1565c0' stroke-width='2'/>
<text x='960' y='524' text-anchor='middle' font-size='13' fill='#111'>More plants?</text>
<text x='960' y='542' text-anchor='middle' font-size='13' fill='#111'>i &lt; 4</text>

<rect x='610' y='504' width='180' height='52' rx='8' fill='#f5f5f5' stroke='#444' stroke-width='2'/>
<text x='700' y='536' text-anchor='middle' font-size='13' fill='#111'>Increment i</text>

<rect x='840' y='620' width='240' height='52' rx='8' fill='#f5f5f5' stroke='#444' stroke-width='2'/>
<text x='960' y='652' text-anchor='middle' font-size='13' fill='#111'>Wait next sample interval</text>

<rect x='840' y='710' width='240' height='52' rx='8' fill='#fff3e0' stroke='#ef6c00' stroke-width='2'/>
<text x='960' y='742' text-anchor='middle' font-size='13' fill='#111'>Read night sensor on A4</text>

<polygon points='960,790 1080,850 960,910 840,850' fill='#e3f2fd' stroke='#1565c0' stroke-width='2'/>
<text x='960' y='855' text-anchor='middle' font-size='13' fill='#111'>Night detected?</text>

<rect x='1160' y='824' width='260' height='52' rx='8' fill='#f5f5f5' stroke='#444' stroke-width='2'/>
<text x='1290' y='856' text-anchor='middle' font-size='13' fill='#111'>Turn ON relay 5 (night light)</text>

<rect x='500' y='824' width='260' height='52' rx='8' fill='#f5f5f5' stroke='#444' stroke-width='2'/>
<text x='630' y='856' text-anchor='middle' font-size='13' fill='#111'>Turn OFF relay 5</text>

<line x1='190' y1='96' x2='240' y2='96' stroke='#444' stroke-width='2.5' marker-end='url(#arrow)'/>
<line x1='490' y1='96' x2='540' y2='96' stroke='#444' stroke-width='2.5' marker-end='url(#arrow)'/>
<line x1='770' y1='96' x2='820' y2='96' stroke='#444' stroke-width='2.5' marker-end='url(#arrow)'/>
<line x1='960' y1='126' x2='960' y2='170' stroke='#444' stroke-width='2.5' marker-end='url(#arrow)'/>

<line x1='1080' y1='230' x2='1140' y2='230' stroke='#444' stroke-width='2.5' marker-end='url(#arrow)'/>
<text x='1105' y='214' font-size='12' fill='#2e7d32'>Yes</text>
<line x1='1265' y1='256' x2='1265' y2='294' stroke='#444' stroke-width='2.5' marker-end='url(#arrow)'/>
<line x1='1265' y1='346' x2='1265' y2='384' stroke='#444' stroke-width='2.5' marker-end='url(#arrow)'/>
<line x1='1265' y1='436' x2='1265' y2='530' stroke='#444' stroke-width='2.5'/>
<line x1='1265' y1='530' x2='1080' y2='530' stroke='#444' stroke-width='2.5' marker-end='url(#arrow)'/>

<line x1='960' y1='290' x2='960' y2='470' stroke='#444' stroke-width='2.5' marker-end='url(#arrow)'/>
<text x='972' y='380' font-size='12' fill='#c62828'>No</text>

<line x1='840' y1='530' x2='790' y2='530' stroke='#444' stroke-width='2.5' marker-end='url(#arrow)'/>
<text x='804' y='514' font-size='12' fill='#2e7d32'>Yes</text>
<line x1='610' y1='530' x2='430' y2='530' stroke='#444' stroke-width='2.5'/>
<line x1='430' y1='530' x2='430' y2='150' stroke='#444' stroke-width='2.5'/>
<line x1='430' y1='150' x2='820' y2='150' stroke='#444' stroke-width='2.5'/>
<line x1='820' y1='150' x2='820' y2='96' stroke='#444' stroke-width='2.5' marker-end='url(#arrow)'/>

<line x1='960' y1='590' x2='960' y2='620' stroke='#444' stroke-width='2.5' marker-end='url(#arrow)'/>
<text x='972' y='606' font-size='12' fill='#c62828'>No</text>
<line x1='960' y1='672' x2='960' y2='710' stroke='#444' stroke-width='2.5' marker-end='url(#arrow)'/>
<line x1='960' y1='762' x2='960' y2='790' stroke='#444' stroke-width='2.5' marker-end='url(#arrow)'/>

<line x1='1080' y1='850' x2='1160' y2='850' stroke='#444' stroke-width='2.5' marker-end='url(#arrow)'/>
<text x='1100' y='836' font-size='12' fill='#2e7d32'>Yes</text>
<line x1='840' y1='850' x2='760' y2='850' stroke='#444' stroke-width='2.5' marker-end='url(#arrow)'/>
<text x='774' y='836' font-size='12' fill='#c62828'>No</text>

<line x1='1290' y1='824' x2='1290' y2='770' stroke='#444' stroke-width='2.5'/>
<line x1='1290' y1='770' x2='430' y2='770' stroke='#444' stroke-width='2.5'/>
<line x1='430' y1='770' x2='430' y2='150' stroke='#444' stroke-width='2.5'/>

<line x1='630' y1='824' x2='630' y2='770' stroke='#444' stroke-width='2.5'/>
<line x1='630' y1='770' x2='430' y2='770' stroke='#444' stroke-width='2.5'/>
</svg>
