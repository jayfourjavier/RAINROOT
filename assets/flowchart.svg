<svg xmlns="http://www.w3.org/2000/svg"
   width="1200"
   height="960"
   viewBox="0 0 1200 960">

   <!-- BACKGROUND -->
   <rect id="background"
      x="0" y="0"
      width="1200" height="960"
      fill="#ffffff" />

   <!-- START -->
   <rect id="start"
      x="520" y="80"
      width="160" height="60"
      rx="30" ry="30"
      fill="#ffffff"
      stroke="#000000"
      stroke-width="2" />

   <text id="start-label"
      x="600" y="110"
      text-anchor="middle"
      dominant-baseline="middle"
      font-family="Arial"
      font-size="18"
      fill="#000000">START</text>

   <!-- END -->
   <rect id="end"
      x="520" y="820"
      width="160" height="60"
      rx="30" ry="30"
      fill="#ffffff"
      stroke="#000000"
      stroke-width="2" />

   <text id="end-label"
      x="600" y="850"
      text-anchor="middle"
      dominant-baseline="middle"
      font-family="Arial"
      font-size="18"
      fill="#000000">END</text>

</svg>